name: Android CI/CD

on:
  push:
    branches: [ main, hot-fix, dev ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    name: Build & Test (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (library)
        run: ./gradlew --no-daemon :ImageLoader:testDebugUnitTest

      - name: Assemble debug app and library
        run: ./gradlew --no-daemon :app:assembleDebug :ImageLoader:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: imageloader-debug-aar
          path: ImageLoader/build/outputs/aar/*-debug.aar

  release:
    name: Release & Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release app and library
        run: ./gradlew --no-daemon :app:assembleRelease :ImageLoader:assembleRelease -PVERSION_NAME=${{ steps.version.outputs.version }}

      - name: Publish ImageLoader to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :ImageLoader:publishReleasePublicationToGitHubPackagesRepository -PVERSION_NAME=${{ steps.version.outputs.version }}

      - name: Upload release artifacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            ImageLoader/build/outputs/aar/*-release.aar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            ImageLoader/build/outputs/aar/*-release.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
